kind = "web"
previewPath = "/"
title = "Arc Builder Hub"
version = "1.0.0"
id = "artifacts/arc-builder-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20098

[services.development]
run = "pnpm --filter @workspace/arc-builder-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arc-builder-hub", "run", "build" ]
publicDir = "artifacts/arc-builder-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20098"
BASE_PATH = "/"
